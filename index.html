<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary, My Baby</title>

    <!-- global setting -->
    <link rel="stylesheet" href="css/root.css">

    <!-- NAV -->
    <link rel="stylesheet" href="css/nav.css">

    <!-- MEMORIES -->
    <link rel="stylesheet" href="css/memories.css">


</head>

<body>

    <div class="overlay"></div>
    <header>
        <nav>
            <div class="menu no-select">
                <input type="checkbox" hidden id="menu-toggle">
                <label for="menu-toggle" class="menu">
                    <div class="menu-toggle">
                        <span class="open-menu">MENU</span>
                        <span class="close-menu">CLOSE</span>
                    </div>
                    <svg class="burger" width="14" height="7" viewBox="0 0 15 8" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 6H14" stroke="currentColor" stroke-width="2" />

                        <line y1="1" x2="14" y2="1" stroke="currentColor" stroke-width="2" />
                    </svg>
                </label>
            </div>
        </nav>
        <div class="expand-menu">
            <div class="menu-list">
                <ul>
                    <li class="item active">
                        <div class="block"></div>
                        <a href="#">Home</a>
                    </li>

                    <li class="item">
                        <div class="block"></div>
                        <a href="#">How long ...</a>
                    </li>

                    <li class="item">
                        <div class="block"></div>
                        <a href="#">Our Months</a>
                    </li>

                    <li class="item">
                        <div class="block"></div>
                        <a href="#">Gallery</a>
                    </li>
                    
                    <li class="item">
                        <div class="block"></div>
                        <a href="#">Favorite pictures</a>
                    </li>

                    <li class="item">
                        <div class="block"></div>
                        <a href="#">Songs that ...</a>
                    </li>

                    <li class="item">
                        <div class="block"></div>
                        <a href="#">Reasons why ...</a>
                    </li>

                    <li class="item">
                        <div class="block"></div>
                        <a href="#">Our firsts</a>
                    </li>

                    <li class="item">
                        <div class="block"></div>
                        <a href="#">For you</a>
                    </li>

                    <li class="item">
                        <div class="block"></div>
                        <a href="#">Letter for future us</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>


    <section id="memories">
        <div class="memories">
            <div class="heading">
                <h1>
                    Memories
                </h1>
                <p>
                    we've been through a LOT, my love. let's look back on our favorite memories here.
                </p>
            </div>
            <div class="gallery" id="galleryGrid">
                <div class="floating-buttons">
                    <button class="random-memory-btn" type="button" id="randomMemoryBtn">
                        <span aria-hidden="true"> 🎲 </span> Relive a random moment
                    </button>
                    <button class="back-to-top-btn" type="button" id="backToTopBtn" aria-label="Back to top">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16">
                            <path fill="currentColor"
                                d="M3 2.25a.75.75 0 0 1 .75-.75h8.5a.75.75 0 0 1 0 1.5h-8.5A.75.75 0 0 1 3 2.25Zm5.53 2.97l3.75 3.75a.749.749 0 1 1-1.06 1.06L8.75 7.561v6.689a.75.75 0 0 1-1.5 0V7.561L4.78 10.03a.749.749 0 1 1-1.06-1.06l3.75-3.75a.749.749 0 0 1 1.06 0Z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- REUSABLE CARD COMPONENT FOR GALLERY-->
            <template id="memoryCardTemplate">
                <div class="memory-card" role="button" tabindex="0">
                    <img class="memory-card__image" src="" alt="">
                    <div class="memory-card__overlay">
                        <p class="memory-card__title"></p>
                    </div>
                </div>
            </template>


    </section>
    <!-- MODAL FRAME -->
    <div class="memory-modal" id="memoryModal" aria-hidden="true">
        <div class="memory-modal__backdrop" id="modalBackdrop"></div>

        <div class="memory-modal__content" role="dialog" aria-modal="true">
            <button class="memory-modal__close" type="button" id="modalClose" aria-label="Close">&times;</button>
            <img class="memory-modal__image" src="" alt="">
            <div class="memory-modal__body">
                <h2 class="memory-modal__title"></h2>
                <p class="memory-modal__date"></p>
                <p class="memory-modal__description"></p>
            </div>
        </div>
    </div>

    <script type="module" src="js/memories.js"></script>
    <script type="module" src="js/nav.js"></script>

</body>

</html>
